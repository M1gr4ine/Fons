        if (node.saving) {
          const saved = await node.saving;
          if (!saved || saved.conflict || !validNode(node) || node.item.status !== 'buffering') return;
        }
        const prepared = await prepareClientFiles(rawFiles, itemAttachments(node.item).length);
        for (const item of prepared) revokeManagedUrl(item.previewUrl);
        if (!prepared.length || !validNode(node) || node.item.status !== 'buffering') return;
        const newAttachments = prepared.map(({ name, mimeType, dataBase64 }) => ({ name, mimeType, dataBase64 }));
        await runRowUpdate(node, () => ({
          newText: normalizeSingleLine(node.refs.input.value),
          keepAttachments: itemAttachments(node.item).map((a) => a.storedName),
          newAttachments,
        }));
        syncHold();
      }

      function enqueueDraftFiles(fileList) {
        syncSession();
        const rawFiles = Array.from(fileList || []).filter(Boolean);
        if (!state.registered || !rawFiles.length) return state.draftPrepTail;
        const id = state.id;
        const session = state.session;
        state.draftPrepPending += 1;
        updateAvailability();
        const next = state.draftPrepTail.then(async () => {
          if (!sameSession(id, session) || !state.registered) return;
          const prepared = await prepareClientFiles(rawFiles, state.draftAttachments.length);
          if (!prepared.length) return;
          if (!sameSession(id, session) || !state.registered) {
            for (const item of prepared) revokeManagedUrl(item.previewUrl);
            return;
          }
          state.draftAttachments.push(...prepared);
          renderDraftAttachments();
          elements.quick.focus();
        }).finally(() => {
          if (sameSession(id, session)) {
            state.draftPrepPending = Math.max(0, state.draftPrepPending - 1);
            updateAvailability();
          }
        });
        state.draftPrepTail = next.catch(() => {});
        return next;
      }

      function restoreCheck(node) {
        if (validNode(node)) node.refs.check.checked = node.item.status === 'done';
      }

      async function changeCheck(node) {
        if (!validNode(node)) return;
        const saved = await saveRow(node);
        if (!saved || saved.conflict || !validNode(node)) { restoreCheck(node); return; }
        const action = node.item.status === 'done' ? 'reopen' : 'complete';
        const fields = () => {
          if (!validNode(node)) return null;
          return action === 'complete' ? { token: node.item.token } : itemArguments(node);
        };
        const result = await mutate(action, fields, node.conversation);
        if (!result || result.conflict) restoreCheck(node);
        syncHold();
      }

      async function deleteRow(node) {
        if (node.removing || !validNode(node)) return;
        if (node.saving) {
          const saved = await node.saving;
          if (!saved || saved.conflict || !validNode(node)) return;
        }
        if (node.item.status === 'delivered' && !window.confirm('模型已收到该条，将发送撤回通知')) return;
        if (!validNode(node)) return;
        node.removing = true;
        if (state.heldId === node.item.id) clearHold();
        try {
          await mutate('remove', () => validNode(node) ? itemArguments(node) : null, node.conversation, (result) => {
            if (result.conflict) node.conflicted = true;
          });
        } finally {
          node.removing = false;
        }
        syncHold();
      }

      function focusNextEditable(afterIndex) {
        for (let i = afterIndex + 1; i < elements.rows.children.length; i++) {
          const row = elements.rows.children[i];
          if (row.item?.status === 'buffering') {
            row.refs.input.focus();
            return;
          }
        }
        elements.quick.focus();
      }

      function onRowKey(event, node) {
        if (event.isComposing || event.keyCode === 229 || event.key !== 'Enter') return;
        event.preventDefault();
        if (node.item.status !== 'buffering') return;
        const index = [...elements.rows.children].indexOf(node);
        const id = node.conversation;
        void saveRow(node).then((result) => {
          if (!result || result.conflict || id !== conversationId() || !validNode(node)) return;
          focusNextEditable(index);
          syncHold();
        });
      }

      function extractClipboardFiles(clipboardData) {
        if (!clipboardData) return [];
        if (clipboardData.files && clipboardData.files.length) return Array.from(clipboardData.files);
        if (!clipboardData.items) return [];
        const files = [];
        for (const item of Array.from(clipboardData.items)) {
          if (item?.kind === 'file' && typeof item.getAsFile === 'function') {
            const file = item.getAsFile();
            if (file) files.push(file);
          }
        }
        return files;
      }

      function pasteSingleLine(event, node) {
        if (node.item.status !== 'buffering') return;
        const files = extractClipboardFiles(event.clipboardData);
        if (files.length) {
          event.preventDefault();
          void attachFilesToRow(node, files);
          return;
        }
        const text = event.clipboardData?.getData?.('text') || '';
        if (!/[\r\n]/.test(text)) return;
        event.preventDefault();
        const input = event.currentTarget;
        input.setRangeText(text.replace(/[\r\n]+/g, ' '), input.selectionStart, input.selectionEnd, 'end');
        node.dirty = true;
        state.lastTypedAt = Date.now();
        resize(input);
      }

      function prefersReducedMotion() {
        return Boolean(window.matchMedia?.('(prefers-reduced-motion: reduce)').matches);
      }

      function animateExit(node, mode, box) {
        if (!box?.height || typeof node.animate !== 'function' || prefersReducedMotion()) return;
        const host = elements.pool;
        if (typeof host.getBoundingClientRect !== 'function') return;
        const base = host.getBoundingClientRect();
        const ghost = node.cloneNode(true);
        ghost.className = 'row ghost';
        delete ghost.dataset.testid;
        delete ghost.dataset.fresh;
        delete ghost.dataset.holding;
        ghost.setAttribute('aria-hidden', 'true');
        ghost.querySelector('textarea').value = node.refs.input.value;
        ghost.querySelector('input').checked = node.refs.check.checked;
        ghost.style.top = `${box.top - base.top}px`;
        ghost.style.left = `${box.left - base.left}px`;
        ghost.style.width = `${box.width}px`;
        ghost.style.height = `${box.height}px`;
        host.append(ghost);
        const target = mode === 'up'
          ? 'translateY(-10px) scale(0.98)'
          : mode === 'remove'
            ? 'translateX(14px) scale(0.97)'
            : 'translateY(4px) scale(0.98)';
        const anim = ghost.animate([
          { opacity: 1, transform: 'translate(0, 0) scale(1)' },
          { opacity: 0, transform: target },
        ], { duration: mode === 'remove' ? 200 : 170, easing: 'cubic-bezier(0.22, 1, 0.36, 1)', fill: 'forwards' });
        const cleanup = () => ghost.remove();
        anim.onfinish = cleanup;
        anim.oncancel = cleanup;
      }

      function detachRow(node, box) {
        const mode = node.removing ? 'remove' : (node.item?.status === 'done' ? 'up' : 'fade');
        animateExit(node, mode, box);
        node.remove();
      }

      function createRow(item) {
        const node = document.createElement('div');
        node.className = 'row';
        node.dataset.testid = 'fons-row';
        node.setAttribute('role', 'listitem');
        node.conversation = state.id;
        node.session = state.session;
        if (state.loadedOnce && !state.knownTokens.has(item.token)) node.dataset.fresh = 'true';
        const water = document.createElement('span');
        water.className = 'row-water';
        water.setAttribute('aria-hidden', 'true');
        const check = document.createElement('input');
        check.type = 'checkbox';
        check.dataset.testid = 'fons-check';
        check.setAttribute('aria-label', '标记完成');
        const input = document.createElement('textarea');
        input.rows = 1;
        input.dataset.testid = 'fons-input';
        input.setAttribute('aria-label', '灵感内容');
        const attWrap = document.createElement('div');
        attWrap.className = 'row-attachments';
        attWrap.hidden = true;
        const timer = document.createElement('span');
        timer.className = 'row-timer';
        timer.setAttribute('aria-hidden', 'true');
        const status = document.createElement('span');
        status.className = 'status';
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'remove';
        remove.textContent = '×';
        remove.setAttribute('aria-label', '删除灵感');
        remove.setAttribute('title', '删除灵感');
        node.refs = { water, check, input, attWrap, timer, status, remove };
        node.append(water, check, input, attWrap, timer, status, remove);
        check.addEventListener('change', () => { void changeCheck(node); });
        input.addEventListener('compositionstart', () => { state.composing = true; });
        input.addEventListener('compositionend', () => { state.composing = false; state.lastTypedAt = Date.now(); });
        input.addEventListener('focus', () => {
          if (node.item.status !== 'buffering') return;
          node.focused = true;
          syncHold();
        });
        input.addEventListener('input', () => {
          if (node.item.status !== 'buffering') return;
          node.dirty = true;
          state.lastTypedAt = Date.now();
          resize(input);
        });
        input.addEventListener('blur', () => {
          node.focused = false;
          releaseNodeFreeze(node);
          if (node.item.status !== 'buffering') {
            syncHold();
            return;
          }
          state.etag = '';
          state.refreshNeeded = true;
          void saveRow(node).then(() => { syncHold(); return poll(); });
        });
        input.addEventListener('keydown', (event) => onRowKey(event, node));
        input.addEventListener('paste', (event) => pasteSingleLine(event, node));
        remove.addEventListener('click', () => { void deleteRow(node); });
        updateRow(node, item);
        return node;
      }

      function refreshActiveRow(node, item) {
        const nextNote = itemNote(item);
        if (node.refreshValue !== nextNote && itemNote(node.item) !== nextNote && !node.conflicted && item.status === 'buffering') return;
        updateRow(node, item);
        if (node.conflicted || item.status !== 'buffering') {
          const { input } = node.refs;
          input.value = nextNote;
          node.dirty = false;
          resize(input);
        }
        node.refreshValue = null;
        node.conflicted = false;
      }

      function activeEditingRow() {
        const active = document.activeElement;
        const row = active?.closest?.('.row');
        return row && active === row.refs?.input ? row : null;
      }

      function isProtectedRow(node, editingRow) {
        if (node.removing || node.item?.status !== 'buffering') return false;
        return Boolean(node === editingRow || node.focused || node.dirty || node.saving);
      }

      function measureRowTops(nodes) {
        if (prefersReducedMotion()) return null;
        const tops = new Map();
        for (const node of nodes) {
          if (typeof node.getBoundingClientRect === 'function' && typeof node.animate === 'function') {
            tops.set(node, node.getBoundingClientRect().top);
          }
        }
        return tops.size ? tops : null;
      }

      function animateRowShifts(previousTops, kept) {
        if (!previousTops) return;
        for (const node of kept) {
          const oldTop = previousTops.get(node);
          if (oldTop === undefined) continue;
          node.flipAnim?.cancel?.();
          const deltaY = oldTop - node.getBoundingClientRect().top;
          if (Math.abs(deltaY) < 1) continue;
          const anim = node.animate([
            { transform: `translateY(${deltaY}px)` },
            { transform: 'translateY(0)' },
          ], { duration: 180, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' });
          node.flipAnim = anim;
          const clear = () => { if (node.flipAnim === anim) node.flipAnim = null; };
          anim.onfinish = clear;
          anim.oncancel = clear;
        }
      }

      function reconcile(items) {
        const active = document.activeElement?.closest?.('.row');
        const editingRow = activeEditingRow();
        const nodes = [...elements.rows.children];
        const existing = new Map(nodes.map((node) => [node.dataset.token, node]));
        const protectedRows = nodes.filter((node) => isProtectedRow(node, editingRow));
        const keep = new Set();
        const plan = [];
        for (const item of items) {
          const protectedNode = protectedRows.find((node) => node.item.rowIndex === item.rowIndex);
          if (protectedNode && protectedNode.dataset.token !== item.token) {
            keep.add(protectedNode);
            plan.push({ node: protectedNode, item, protected: true });
            continue;
          }
          const node = existing.get(item.token) || createRow(item);
          keep.add(node);
          plan.push({ node, item, protected: false });
        }
        const toDetach = nodes.filter((node) => !keep.has(node) && (node.conflicted || !protectedRows.includes(node)));
        const detachBoxes = toDetach.length
          ? new Map(toDetach.map((node) => [node, typeof node.getBoundingClientRect === 'function' ? node.getBoundingClientRect() : null]))
          : null;
        const previousTops = toDetach.length ? measureRowTops(nodes.filter((node) => keep.has(node))) : null;
        for (const node of toDetach) detachRow(node, detachBoxes.get(node));
        let position = 0;
        for (const entry of plan) {
          const { node, item } = entry;
          if (entry.protected) {
            refreshActiveRow(node, item);
          } else {
            updateRow(node, item);
            const anchor = elements.rows.children[position];
            if (node !== active && !node.focused && node !== anchor) elements.rows.insertBefore(node, anchor || null);
            resize(node.refs.input);
          }
          position += 1;
        }
        animateRowShifts(previousTops, keep);
        state.knownTokens = new Set(items.map((item) => item.token));
        state.loadedOnce = true;
      }

      function applySnapshot(data) {
        if (!data.registered || data.scopeMismatch || data.workspaceDisabled) {
          clearPoolRows();
          if (data.scopeMismatch) {
            showEmpty('当前会话与工作区状态不匹配，请切换到目标会话或重新打开灵感池。');
          } else if (data.workspaceDisabled) {
            showEmpty('当前工作区已停用 Fons，可在右上角「设置」中开启挂载。');
          } else if (state.workspace === 'empty') {
            showEmpty('当前无工作区会话尚未登记，可在右上角「设置」中立即登记，或新开会话自动启用。');
          } else {
            showEmpty('当前会话尚未登记，可在右上角「设置」中立即登记，或新开会话自动启用。');
          }
          return;
        }
        state.registered = true;
        bindWorkspace();
        updateAvailability();
        if (data.items.length > 0) elements.empty.hidden = true;
        state.etag = data.etag;
        state.debounceMs = typeof data.debounceMs === 'number' ? data.debounceMs : DEFAULT_DEBOUNCE_MS;
        updateCount(data.items.filter((item) => item.status !== 'done').length);
        elements.archive.disabled = !data.canArchive;
        reconcile(data.items);
        if (!data.items.length) showEmpty('还没有灵感，随时记一条。', 'idle');
        updateWaterLevels();
      }

      function typingActive() {
        return state.composing || Date.now() - state.lastTypedAt < TYPING_QUIET_MS;
      }

      function canPoll() {
        if (document.hidden || !workspaceReady() || workspaceMismatch()) return false;
        if (!state.id || state.polling || state.busy) return false;
        return state.refreshNeeded || !state.loadedOnce || !typingActive();
      }

      async function poll() {
        syncSession();
        if (!canPoll()) return;
        const id = state.id;
        const epoch = state.epoch;
        const ticket = { id, epoch };
        state.polling = ticket;
        state.refreshNeeded = false;
        const payload = { conversationId: id, workspaceUris: state.workspaceUris };
        if (state.etag) payload.etag = state.etag;
        try {
          const data = await request('/api/pool', payload);
          if (current(id, epoch) && state.polling === ticket && !data.unchanged) applySnapshot(data);
        } catch (error) {
          if (current(id, epoch) && state.polling === ticket) showFailure(error);
        } finally {
          if (state.polling === ticket) {
            state.polling = null;
            if (state.refreshNeeded && !state.busy) { state.etag = ''; void poll(); }
          }
        }
      }

      async function addTexts(texts, expectedValue) {
        syncSession();
        const id = state.id;
        const session = state.session;
        const drafts = state.draftAttachments.slice();
        if ((!texts.length && !drafts.length) || !state.registered) return;
        state.lastTypedAt = 0;
        elements.quick.value = '';
        resize(elements.quick);
        if (drafts.length) {
          state.draftAttachments = [];
          renderDraftAttachments();
        } else {
          updateAvailability();
        }
        const note = normalizeSingleLine(expectedValue);
        const payload = drafts.length
          ? {
              texts: note ? [note] : [],
              attachments: drafts.map(({ name, mimeType, dataBase64 }) => ({ name, mimeType, dataBase64 })),
            }
          : { texts };
        const result = await mutate('add', payload, id);
        if (session !== state.session || id !== conversationId()) {
          for (const draft of drafts) revokeManagedUrl(draft.previewUrl);
          return;
        }
        if (!result) {
          elements.quick.value = [expectedValue, elements.quick.value].filter(Boolean).join('\n');
          resize(elements.quick);
          if (drafts.length) {
            state.draftAttachments = [...drafts, ...state.draftAttachments];
            renderDraftAttachments();
          } else {
            updateAvailability();
          }
          return;
        }
        for (const draft of drafts) revokeManagedUrl(draft.previewUrl);
        if (result.count > 1) {
          showNotice(`已拆入 ${result.count} 条灵感`);
        }
      }

      async function submitQuickInput() {
        syncSession();
        if (!state.registered) return;
        if (state.draftPrepPending > 0) {
          if (state.submitAwaitingPrep) return;
          const id = state.id;
          const session = state.session;
          state.submitAwaitingPrep = true;
          try {
            await state.draftPrepTail;
          } finally {
            if (sameSession(id, session)) state.submitAwaitingPrep = false;
          }
          syncSession();
          if (!sameSession(id, session) || !state.registered) return;
        }
        const value = elements.quick.value;
        void addTexts(splitLines(value), value);
      }

      function hasDraggedFiles(event) {
        const types = event?.dataTransfer?.types;
        if (!types) return false;
        return typeof types.includes === 'function' ? types.includes('Files') : Array.from(types).includes('Files');
      }

      function resolveBufferingDropRow(target) {
        const row = target?.closest?.('.row');
        return row && row.item?.status === 'buffering' && !row.removing ? row : null;
      }

      function updateDropHover(targetRow) {
        if (state.dropRow && state.dropRow !== targetRow) {
          delete state.dropRow.dataset.dropTarget;
        }
        state.dropRow = targetRow;
        if (targetRow) {
          targetRow.dataset.dropTarget = 'true';
          delete elements.pool.dataset.dropping;
          elements.dropBanner.textContent = '松开将附件添加到此条灵感';
        } else {
          elements.pool.dataset.dropping = 'true';
          elements.dropBanner.textContent = '松开添加附件到灵感池';
        }
        elements.dropBanner.hidden = false;
      }

      elements.quick.addEventListener('compositionstart', () => { state.composing = true; });
      elements.quick.addEventListener('compositionend', () => { state.composing = false; state.lastTypedAt = Date.now(); });
      elements.quick.addEventListener('input', () => {
        state.lastTypedAt = Date.now();
        resize(elements.quick);
        updateAvailability();
      });
      elements.quick.addEventListener('keydown', (event) => {
        if (event.isComposing || event.keyCode === 229 || event.key !== 'Enter') return;
        event.preventDefault();
        void submitQuickInput();
      });
      elements.quick.addEventListener('paste', (event) => {
        const files = extractClipboardFiles(event.clipboardData);
        if (files.length) {
          event.preventDefault();
          void enqueueDraftFiles(files);
          return;
        }
        const text = event.clipboardData?.getData?.('text') || '';
        if (!/[\r\n]/.test(text)) return;
        event.preventDefault();
        const input = elements.quick;
        if (state.draftAttachments.length || state.draftPrepPending > 0) {
          input.setRangeText(text.replace(/[\r\n]+/g, ' '), input.selectionStart, input.selectionEnd, 'end');
          state.lastTypedAt = Date.now();
          resize(input);
          updateAvailability();
          return;
        }
        input.setRangeText(text, input.selectionStart, input.selectionEnd, 'end');
        const value = input.value;
        resize(input);
        void addTexts(splitLines(value), value);
      });
      elements.attach.addEventListener('click', () => {
        if (!state.registered) return;
        elements.fileInput.value = '';
        elements.fileInput.click();
      });
      elements.fileInput.addEventListener('change', () => {
        const files = Array.from(elements.fileInput.files || []);
        elements.fileInput.value = '';
        if (files.length) void enqueueDraftFiles(files);
      });
      elements.quickSubmit.addEventListener('click', () => {
        if (state.registered) void submitQuickInput();
      });
      elements.pool.addEventListener('dragenter', (event) => {
        if (!state.registered || !hasDraggedFiles(event)) return;
        event.preventDefault();
        state.dragDepth += 1;
        updateDropHover(resolveBufferingDropRow(event.target));
      });
      elements.pool.addEventListener('dragover', (event) => {
        if (!state.registered || !hasDraggedFiles(event)) return;
        event.preventDefault();
        if (event.dataTransfer) event.dataTransfer.dropEffect = 'copy';
        updateDropHover(resolveBufferingDropRow(event.target));
      });
      elements.pool.addEventListener('dragleave', (event) => {
        if (!state.dragDepth) return;
        state.dragDepth = Math.max(0, state.dragDepth - 1);
        if (state.dragDepth === 0 || !event.relatedTarget) clearDragVisuals();
      });
      elements.pool.addEventListener('drop', (event) => {
        if (!state.registered || !hasDraggedFiles(event)) return;
        event.preventDefault();
        const targetRow = resolveBufferingDropRow(event.target);
        clearDragVisuals();
        const files = Array.from(event.dataTransfer?.files || []);
        if (!files.length) return;
        if (targetRow) void attachFilesToRow(targetRow, files);
        else void enqueueDraftFiles(files);
      });
      elements.lightbox.addEventListener('click', (event) => {
        if (event.target !== elements.lightboxImg) closeLightbox();
      });
      document.addEventListener('keydown', (event) => {
        if (event.key !== 'Escape') return;
        if (!elements.lightbox.hidden) {
          event.preventDefault();
          closeLightbox();
        } else if (state.settingsOpen) {
          event.preventDefault();
          closeSettings();
        }
      });
      elements.settingsToggle.addEventListener('click', () => {
        if (state.settingsOpen) closeSettings();
        else openSettings();
      });
      elements.settingsClose.addEventListener('click', closeSettings);
      elements.settingsBackdrop.addEventListener('click', closeSettings);
      elements.flowUp.addEventListener('click', () => applyFlowMode('up'));
      elements.flowRight.addEventListener('click', () => applyFlowMode('right'));
      elements.debounceInput.addEventListener('change', commitDebounceInput);
      elements.debounceInput.addEventListener('keydown', (event) => {
        if (event.key !== 'Enter') return;
        event.preventDefault();
        commitDebounceInput();
      });
      for (const chip of elements.debouncePresets) {
        chip.addEventListener('click', () => {
          const seconds = Number(chip.dataset.debouncePreset);
          if (Number.isInteger(seconds)) void sendSettings({ debounceSec: seconds });
        });
      }
      elements.stopWait.addEventListener('change', () => {
        void sendSettings({ stopWaitDebounce: Boolean(elements.stopWait.checked) });
      });
      elements.autoAttach.addEventListener('change', () => {
        void sendSettings({ autoAttachWorkspaces: Boolean(elements.autoAttach.checked) });
      });
      elements.currentWsToggle.addEventListener('click', () => {
        syncSession();
        const ws = state.settingsData?.currentWorkspace;
        if (!ws?.path) return;
        const mode = ws.enabled ? 'disable' : 'enable';
        const update = { workspaceAction: { path: ws.path, mode } };
        if (mode === 'enable' && !state.settingsData?.sessionRegistered && state.id && workspaceReady()) {
          update.registerCurrentSession = true;
        }
        void sendSettings(update);
      });
      elements.registerSession.addEventListener('click', () => {
        void sendSettings({ registerCurrentSession: true }).then((data) => {
          if (data?.sessionRegistered) closeSettings();
        });
      });
      elements.archive.addEventListener('click', () => {
        void mutate('archive', {}).then((result) => {
          if (result?.count) showNotice(`已归档 ${result.count} 条灵感`);
        });
      });
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) syncHold();
        else { updateWaterLevels(); void poll(); }
      });
      if (!nativeAutoSize && typeof ResizeObserver !== 'undefined') {
        const observer = new ResizeObserver(() => {
          for (const textarea of document.querySelectorAll('textarea')) resize(textarea);
        });
        observer.observe(elements.pool);
      }
      applyFlowMode(state.flowMode);
      setInterval(() => { if (!document.hidden) updateWaterLevels(); }, TIMER_TICK_MS);
      setInterval(() => { syncSession(); syncHold(); void poll(); }, POLL_INTERVAL_MS);
      syncSession();
      if (typeof window.sidecar?.onWorkspaceChange === 'function' && typeof window.sidecar?.fetch === 'function') {
        window.sidecar.onWorkspaceChange(workspaceChanged);
      } else {
        state.workspace = 'unavailable';
        showContext();
      }
    })();
  </script>
</body>
</html>
