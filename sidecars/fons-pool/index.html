        if (state.dropRow && state.dropRow !== targetRow) {
          delete state.dropRow.dataset.dropTarget;
        }
        state.dropRow = targetRow;
        if (targetRow) {
          targetRow.dataset.dropTarget = 'true';
          if (elements.pool) delete elements.pool.dataset.dropping;
          if (elements.dropBanner) {
            elements.dropBanner.textContent = '松开将附件添加到此条灵感';
            elements.dropBanner.hidden = false;
          }
        } else {
          if (elements.pool) elements.pool.dataset.dropping = 'true';
          if (elements.dropBanner) {
            elements.dropBanner.textContent = '松开添加附件到灵感池';
            elements.dropBanner.hidden = false;
          }
        }
      }

      elements.quick.addEventListener('compositionstart', () => { state.composing = true; });
      elements.quick.addEventListener('compositionend', () => { state.composing = false; state.lastTypedAt = Date.now(); });
      elements.quick.addEventListener('input', () => {
        state.lastTypedAt = Date.now();
        resize(elements.quick);
        updateAvailability();
      });
      elements.quick.addEventListener('keydown', (event) => {
        if (event.isComposing || event.keyCode === 229 || event.key !== 'Enter') return;
        event.preventDefault();
        void submitQuickInput();
      });
      elements.quick.addEventListener('paste', (event) => {
        const files = extractClipboardFiles(event.clipboardData);
        if (files.length) {
          event.preventDefault();
          void enqueueDraftFiles(files);
          return;
        }
        const text = event.clipboardData?.getData?.('text') || '';
        if (!/[\r\n]/.test(text)) return;
        event.preventDefault();
        const input = elements.quick;
        if (state.draftAttachments.length || state.draftPrepPending > 0) {
          input.setRangeText(text.replace(/[\r\n]+/g, ' '), input.selectionStart, input.selectionEnd, 'end');
          state.lastTypedAt = Date.now();
          resize(input);
          updateAvailability();
          return;
        }
        input.setRangeText(text, input.selectionStart, input.selectionEnd, 'end');
        const value = input.value;
        resize(input);
        void addTexts(value.split(/\r\n|\r|\n/).map((line) => line.trim()).filter(Boolean), value);
      });
      if (elements.attach && elements.fileInput) {
        elements.attach.addEventListener('click', () => {
          if (!state.registered) return;
          elements.fileInput.value = '';
          elements.fileInput.click?.();
        });
        elements.fileInput.addEventListener('change', () => {
          const files = Array.from(elements.fileInput.files || []);
          elements.fileInput.value = '';
          if (files.length) void enqueueDraftFiles(files);
        });
      }
      if (elements.quickSubmit) {
        elements.quickSubmit.addEventListener('click', () => {
          if (state.registered) void submitQuickInput();
        });
      }
      if (elements.pool) {
        elements.pool.addEventListener('dragenter', (event) => {
          if (!state.registered || !hasDraggedFiles(event)) return;
          event.preventDefault?.();
          state.dragDepth += 1;
          updateDropHover(resolveBufferingDropRow(event.target));
        });
        elements.pool.addEventListener('dragover', (event) => {
          if (!state.registered || !hasDraggedFiles(event)) return;
          event.preventDefault?.();
          if (event.dataTransfer) event.dataTransfer.dropEffect = 'copy';
          updateDropHover(resolveBufferingDropRow(event.target));
        });
        elements.pool.addEventListener('dragleave', (event) => {
          if (!state.dragDepth) return;
          state.dragDepth = Math.max(0, state.dragDepth - 1);
          if (state.dragDepth === 0 || !event.relatedTarget) clearDragVisuals();
        });
        elements.pool.addEventListener('drop', (event) => {
          if (!state.registered || !hasDraggedFiles(event)) return;
          event.preventDefault?.();
          const targetRow = resolveBufferingDropRow(event.target);
          clearDragVisuals();
          const files = Array.from(event.dataTransfer?.files || []);
          if (!files.length) return;
          if (targetRow) void attachFilesToRow(targetRow, files);
          else void enqueueDraftFiles(files);
        });
      }
      if (elements.lightbox) {
        elements.lightbox.addEventListener('click', (event) => {
          const img = elements.lightbox.querySelector?.('.lightbox-img');
          if (event.target !== img) closeLightbox();
        });
      }
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && elements.lightbox && !elements.lightbox.hidden) {
          event.preventDefault?.();
          closeLightbox();
        }
      });
      if (elements.flowMode) {
        elements.flowMode.addEventListener('click', () => {
          applyFlowMode(state.flowMode === 'up' ? 'right' : 'up');
        });
      }
      elements.archive.addEventListener('click', () => {
        void mutate('archive', {}).then((result) => {
          if (result?.count) showNotice(`已归档 ${result.count} 条灵感`);
        });
      });
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) syncHold();
        else void poll();
      });
      if (!nativeAutoSize && typeof ResizeObserver !== 'undefined') {
        const observer = new ResizeObserver(() => {
          for (const textarea of document.querySelectorAll('textarea')) resize(textarea);
        });
        observer.observe(document.querySelector('.pool'));
      }
      applyFlowMode(state.flowMode);
      setInterval(() => { syncSession(); updateWaterLevels(); syncHold(); void poll(); }, 2000);
      syncSession();
      if (typeof window.sidecar?.onWorkspaceChange === 'function' && typeof window.sidecar?.fetch === 'function') {
        window.sidecar.onWorkspaceChange(workspaceChanged);
      } else {
        state.workspace = 'unavailable';
        showContext();
      }
    })();
  </script>
</body>
</html>
