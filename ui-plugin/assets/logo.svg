      <stop offset="0%" stop-color="#A5F3FC" stop-opacity="0.34"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.32"/>
    </linearGradient>
    <linearGradient id="fons-drop-stroke" x1="9" y1="3.2" x2="15" y2="12.8" gradientUnits="userSpaceOnUse">
